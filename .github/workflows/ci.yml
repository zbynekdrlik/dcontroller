name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14
  # Pinned here, not read from the release: a tampered release must not pass.
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dev version must be higher than main
        run: |
          set -euo pipefail
          ver() { sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' | head -1; }
          head_v=$(ver < Cargo.toml)
          git rev-parse --verify -q origin/main >/dev/null || { echo "origin/main missing"; exit 1; }
          if git cat-file -e origin/main:Cargo.toml 2>/dev/null; then
            base_v=$(git show origin/main:Cargo.toml | ver)
            test -n "$base_v" || { echo "no version in main's Cargo.toml"; exit 1; }
          else
            base_v=""   # main predates the Cargo workspace
          fi
          echo "head=$head_v main=${base_v:-none}"
          test -n "$head_v"
          if [ -n "$base_v" ]; then
            top=$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)
            [ "$top" = "$head_v" ] && [ "$head_v" != "$base_v" ] || { echo "bump the version: $head_v <= $base_v"; exit 1; }
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p dcontroller-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          set -euo pipefail
          base=https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION
          curl -fsSL -o trunk.tgz "$base/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  trunk.tgz" | sha256sum -c -
          tar xzf trunk.tgz -C /usr/local/bin trunk
          trunk --version
      - name: Build web (trunk)
        working-directory: crates/web
        run: trunk build
      - name: Build server
        run: cargo build -p dcontroller -p dstack --bin dcontroller --bin dstack-dev --example arc_rename
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: E2E
        working-directory: e2e
        run: npx playwright test

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release tag on a push to main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          set -euo pipefail
          base=https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION
          curl -fsSL -o trunk.tgz "$base/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$TRUNK_SHA256  trunk.tgz" | sha256sum -c -
          tar xzf trunk.tgz -C /usr/local/bin trunk
      - name: Tag the release (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$pkg"
          if at=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            # A re-run of the same commit is fine; a tag elsewhere means no version bump.
            [ "$at" = "$GITHUB_SHA" ] || { echo "$tag already tags $at, not $GITHUB_SHA: bump the version"; exit 1; }
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "release $tag at $GITHUB_SHA"
      - name: Build release bundle
        id: bundle
        run: |
          set -euo pipefail
          path=$(deploy/package.sh)
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Install the bundle as a systemd service and check it
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          tar -xzf "${{ steps.bundle.outputs.path }}" -C "$dir"
          rel=$(echo "$dir"/dcontroller-*)
          url=http://127.0.0.1:8790
          sudo DC_BIND=127.0.0.1:8790 DC_IFACE=lo "$rel/install.sh"
          ver=$(curl -fsS "$url/api/version")
          echo "served: $ver"
          test "$(sudo stat -c %U:%a /var/lib/dcontroller)" = dcontroller:750   # changes log dir
          [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?\ \([0-9a-f]{7}\)$ ]]
          # A build of main is a release: its version has no -dev suffix.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\ \([0-9a-f]{7}\)$ ]] || { echo "main build is not a release: $ver"; exit 1; }
          fi
          curl -fsS -o "$dir/index.html" "$url/"
          grep -q 'manifest.webmanifest' "$dir/index.html"
          pid=$(systemctl show -p MainPID --value dcontroller)
          test "$(stat -c %U "/proc/$pid")" = dcontroller
          test "$(sudo stat -c '%a %U %G' /etc/dcontroller/config.toml)" = "640 root dcontroller"
          cfg_sum=$(sudo sha256sum /etc/dcontroller/config.toml)

          # Update path: keeps the config, really restarts, still serves.
          sudo "$rel/install.sh"
          test "$(curl -fsS "$url/api/version")" = "$ver"
          test "$(systemctl show -p MainPID --value dcontroller)" != "$pid"
          test "$(sudo sha256sum /etc/dcontroller/config.toml)" = "$cfg_sum"

          # Rollback 1: a binary that accepts the config but cannot serve.
          bad="$dir/bad-bin" && cp -r "$rel" "$bad"
          printf '#!/bin/sh\n[ "$1" = --check-config ] && { echo 127.0.0.1:8790; exit 0; }\nexit 3\n' > "$bad/dcontroller"
          chmod +x "$bad/dcontroller"
          if sudo "$bad/install.sh"; then echo "broken binary installed"; exit 1; fi
          test "$(curl -fsS "$url/api/version")" = "$ver"
          cmp "$rel/dcontroller" /opt/dcontroller/dcontroller
          diff -r "$rel/web" /opt/dcontroller/web

          # Rollback 2: a unit that cannot start the service.
          bad="$dir/bad-unit" && cp -r "$rel" "$bad"
          sed -i 's|^ExecStart=.*|ExecStart=/nonexistent/dcontroller|' "$bad/dcontroller.service"
          if sudo "$bad/install.sh"; then echo "broken unit installed"; exit 1; fi
          test "$(curl -fsS "$url/api/version")" = "$ver"
          cmp "$rel/dcontroller.service" /etc/systemd/system/dcontroller.service

          # A config the new version refuses is never trusted.
          sudo cp /etc/dcontroller/config.toml "$dir/config.keep"
          echo 'typo = 1' | sudo tee -a /etc/dcontroller/config.toml >/dev/null
          if sudo "$rel/install.sh"; then echo "refused config accepted"; exit 1; fi
          sudo cp "$dir/config.keep" /etc/dcontroller/config.toml

          # Failed first install leaves nothing behind.
          sudo systemctl disable --now dcontroller.service
          sudo rm -rf /opt/dcontroller /etc/dcontroller /etc/systemd/system/dcontroller.service
          sudo systemctl daemon-reload
          if sudo DC_BIND=127.0.0.1:8790 DC_IFACE=lo "$dir/bad-bin/install.sh"; then echo "broken first install"; exit 1; fi
          test ! -e /opt/dcontroller/dcontroller
          test ! -e /etc/systemd/system/dcontroller.service
          test ! -e /etc/dcontroller/config.toml
          if systemctl is-enabled -q dcontroller.service 2>/dev/null; then echo "unit left enabled"; exit 1; fi
      - name: Dante NIC guard loads dstack's generic Dante-leg filter
        run: |
          # dstack #264: one generic filter on every PC's Dante leg, the file
          # unchanged from the pinned dstack tag; it replaces the per-box
          # table inet dante_guard of 0.1.60 and older (#84).
          set -euo pipefail
          tag=$(sed -n 's/^dstack = .*tag = "\(v[0-9.]*\)".*/\1/p' crates/server/Cargo.toml)
          test -n "$tag"
          curl -fsSL "https://raw.githubusercontent.com/zbynekdrlik/dstack/$tag/tools/linux/dante-leg.nft" | diff - deploy/dante-leg.nft
          dir=$(mktemp -d)
          tar -xzf "${{ steps.bundle.outputs.path }}" -C "$dir"
          rel=$(echo "$dir"/dcontroller-*)
          sudo ip link add dante0 type dummy
          sudo ip addr add 10.99.7.2/24 dev dante0
          sudo ip link set dante0 up
          # A box upgraded from 0.1.60: the old table and its file are there.
          sudo nft add table inet dante_guard
          sudo install -d /etc/dcontroller && echo old | sudo tee /etc/dcontroller/dante-guard.nft >/dev/null
          # avahi: a config with a [server] section and no deny-interfaces.
          sudo install -d /etc/avahi
          [ -f /etc/avahi/avahi-daemon.conf ] || printf '[server]\nuse-ipv4=yes\n' | sudo tee /etc/avahi/avahi-daemon.conf >/dev/null
          sudo sed -i '/^deny-interfaces=/d' /etc/avahi/avahi-daemon.conf
          if sudo DC_IFACE=nope0 DC_GUARD_SKIP_ROUTING=1 "$rel/dante-guard.sh"; then echo "bad iface accepted"; exit 1; fi
          sudo DC_IFACE=dante0 DC_GUARD_SKIP_ROUTING=1 "$rel/dante-guard.sh"
          sudo DC_IFACE=dante0 DC_GUARD_SKIP_ROUTING=1 "$rel/dante-guard.sh"   # idempotent
          systemctl is-active -q dante-guard.service
          systemctl is-enabled -q dante-guard.service
          test "$(sudo nft list tables | grep -c 'inet dstack_dante_leg')" = 1
          if sudo nft list table inet dante_guard 2>/dev/null; then echo "the old per-box table is left"; exit 1; fi
          test ! -e /etc/dcontroller/dante-guard.nft
          sudo cmp "$rel/dante-leg.nft" /etc/dstack/dante-leg.nft
          sudo nft list chain inet dstack_dante_leg in | grep -q 'iifname != "dante0" accept'
          test "$(sysctl -n net.ipv4.conf.dante0.arp_ignore)" = 1
          test "$(grep -c '^deny-interfaces=dante0$' /etc/avahi/avahi-daemon.conf)" = 1
          # A deny list already there keeps its entries.
          sudo sed -i 's/^deny-interfaces=.*/deny-interfaces=eth9/' /etc/avahi/avahi-daemon.conf
          sudo DC_IFACE=dante0 DC_GUARD_SKIP_ROUTING=1 "$rel/dante-guard.sh"
          grep -qx 'deny-interfaces=eth9,dante0' /etc/avahi/avahi-daemon.conf
          # An update from 0.1.60: install.sh drops guard_users from the
          # config (the generic filter names no user) and reloads the filter.
          sudo DC_BIND=127.0.0.1:8790 DC_IFACE=dante0 "$rel/install.sh"
          echo 'guard_users = ["presenter"]' | sudo tee -a /etc/dcontroller/config.toml >/dev/null
          sudo nft delete table inet dstack_dante_leg
          sudo "$rel/install.sh"
          if sudo grep -q guard_users /etc/dcontroller/config.toml; then echo "guard_users kept"; exit 1; fi
          curl -fsS http://127.0.0.1:8790/api/version
          sudo nft list table inet dstack_dante_leg >/dev/null
          # Other interfaces are untouched.
          sudo -u nobody python3 -I -c 'import socket;s=socket.socket(2,2);s.sendto(b"x",("127.0.0.1",9))'
          sudo systemctl stop dante-guard.service
          if sudo nft list table inet dstack_dante_leg 2>/dev/null; then echo "stop left the table"; exit 1; fi
          sudo systemctl stop dante-guard.service   # a stop with no table is no error
      - name: Dante NIC guard takes Dante's traffic and drops the rest
        run: |
          # In on the leg: Dante's and dstack's ports (meters 8810, ARC 4440,
          # the flow range 29800-31847) from any source port, mDNS answers
          # sent unicast from 5353 to a query's ephemeral port; nothing else.
          set -euo pipefail
          dir=$(mktemp -d)
          tar -xzf "${{ steps.bundle.outputs.path }}" -C "$dir"
          rel=$(echo "$dir"/dcontroller-*)
          sudo ip netns add dante1ns
          sudo ip link add dante1 type veth peer name dante1p
          sudo ip link set dante1p netns dante1ns
          sudo ip addr add 10.98.7.2/24 dev dante1
          sudo ip link set dante1 up
          sudo ip netns exec dante1ns ip addr add 10.98.7.9/24 dev dante1p
          sudo ip netns exec dante1ns ip link set dante1p up
          answer() {  # answer <source port> <port>: the box receives a datagram a device sends
            sudo python3 -I - "$1" "$2" <<'PY'
          import socket, subprocess, sys
          r = socket.socket(2, 2)
          r.bind(("10.98.7.2", int(sys.argv[2])))
          r.settimeout(2)
          send = 'import socket,sys;s=socket.socket(2,2);s.bind(("10.98.7.9",int(sys.argv[1])));s.sendto(b"x",("10.98.7.2",int(sys.argv[2])))'
          subprocess.run(["ip", "netns", "exec", "dante1ns", "python3", "-I", "-c", send, sys.argv[1], sys.argv[2]], check=True)
          r.recv(16)
          PY
          }
          answer 9999 40000   # no guard yet: anything arrives
          # The step above started the unit several times in a few seconds,
          # systemd's start limit; a site box never restarts it that often.
          sudo systemctl reset-failed dante-guard.service
          sudo DC_IFACE=dante1 DC_GUARD_SKIP_ROUTING=1 "$rel/dante-guard.sh"
          if answer 9999 40000; then echo "unsolicited unicast accepted on the Dante NIC"; exit 1; fi
          if answer 9999 9; then echo "a non-Dante port accepted on the Dante NIC"; exit 1; fi
          answer 5353 40000
          answer 9999 8810
          answer 9999 4440
          answer 9999 29800
          answer 9999 31847
          # Any user sends on the leg: the generic filter names no user.
          sudo -u nobody python3 -I -c 'import socket;s=socket.socket(2,2);s.bind(("10.98.7.2",0));s.sendto(b"x",("10.98.7.9",9))'
      - name: Dante NIC guard runs on a VLAN interface
        run: |
          set -euo pipefail
          # Dante may arrive tagged on a LAN port: a name with a dot, which a
          # dotted sysctl key reads as a path separator.
          dir=$(mktemp -d)
          tar -xzf "${{ steps.bundle.outputs.path }}" -C "$dir"
          rel=$(echo "$dir"/dcontroller-*)
          sudo ip link add link dante1 name dante1.70 type vlan id 70
          sudo ip addr add 10.97.7.2/24 dev dante1.70
          sudo ip link set dante1.70 up
          sudo systemctl reset-failed dante-guard.service
          sudo DC_IFACE=dante1.70 DC_GUARD_SKIP_ROUTING=1 "$rel/dante-guard.sh"
          test "$(cat /proc/sys/net/ipv4/conf/dante1.70/arp_ignore)" = 1
          test "$(cat /proc/sys/net/ipv4/conf/dante1.70/arp_announce)" = 2
          sudo nft list chain inet dstack_dante_leg in | grep -q 'iifname != "dante1.70" accept'
      - uses: actions/upload-artifact@v4
        with:
          name: dcontroller-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
