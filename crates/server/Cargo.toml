[package]
name = "dcontroller"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Web Dante controller server: serves the PWA and the controller API."

[dependencies]
anyhow = "1"
# The Dante stack (GPL-3.0-or-later, like this crate): discovery and ARC reads.
dstack = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.91" }
dcontroller-api = { path = "../api" }
# The Dante interface's IPv4 address; already in the tree through dstack.
if-addrs = "0.15"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The latency history (bundled SQLite: no system library on the box).
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
buildver = { path = "../buildver" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
