<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b2430" />
    <title>dcontroller</title>
    <link data-trunk rel="css" href="public/style.css" />
    <link data-trunk rel="copy-file" href="public/manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="public/sw.js" />
    <link data-trunk rel="copy-file" href="public/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- No SRI on the wasm/js preloads: Chromium ignores integrity on fetch preloads and warns in the console; the assets are same-origin. -->
    <link data-trunk rel="rust" data-bin="dcontroller-web" data-integrity="none" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
  </head>
  <body></body>
</html>
